<mat-card>
  <mat-card-header>
    <mat-card-title>{{ titulo() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Elige la hora</mat-label>    
      <input matInput [matTimepicker]="picker" [(ngModel)]="horaActual">
      <mat-timepicker-toggle matSuffix [for]="picker"></mat-timepicker-toggle>
      <mat-timepicker #picker></mat-timepicker>
    </mat-form-field>

    <p>Hora elegida: {{ horaActual() | date:'dd/MM/yyyy HH:mm:ss' | date:'HH:mm:ss' }}</p>
  </mat-card-content>
</mat-card>
